[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jetson-pichick"
version = "0.1.0"
description = "Jetson Orin chicken-cam node: continuous capture + cascaded vision LLM + NATS publish"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27",
  "nats-py>=2.7",
  "pillow>=10.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
jchick = "jchick.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/jchick"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
